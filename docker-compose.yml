services:
  futu-opend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FUTU_OPEND_PORT: ${FUTU_OPEND_PORT:-11111}
        FUTU_OPEND_DOWNLOAD_URL: ${FUTU_OPEND_DOWNLOAD_URL:-https://softwaredownload.futunn.com/Futu_OpenD_10.5.6508_Ubuntu18.04.tar.gz}
        FUTU_OPEND_PKG_NAME: ${FUTU_OPEND_PKG_NAME:-Futu_OpenD_10.5.6508_Ubuntu18.04}

    image: ${IMAGE_NAME:-futu-opend}:${IMAGE_TAG:-latest}

    restart: ${RESTART_POLICY:-unless-stopped}

    ports:
      - "${FUTU_OPEND_PORT:-11111}:${FUTU_OPEND_PORT:-11111}"
      - "${FUTU_TELNET_PORT:-22222}:${FUTU_TELNET_PORT:-22222}"

    volumes:
      - ./logs:/app/logs
      - ${FUTU_PRIVATE_KEY:-./.futu_private_key.pem}:/opt/.futu_private_key.pem:ro
      - opend-data:/home/ubuntu/.com.futunn.FutuOpenD

    environment:
      - TZ=Asia/Shanghai
      - FUTU_LOGIN_ACCOUNT=${FUTU_LOGIN_ACCOUNT}
      - FUTU_LOGIN_PWD=${FUTU_LOGIN_PWD}
      - FUTU_OPEND_IP=${FUTU_OPEND_IP:-0.0.0.0}
      - FUTU_OPEND_PORT=${FUTU_OPEND_PORT:-11111}
      - FUTU_TELNET_IP=${FUTU_TELNET_IP:-0.0.0.0}
      - FUTU_TELNET_PORT=${FUTU_TELNET_PORT:-22222}
      - AUTO_HOLD_QUOTE_RIGHT=${AUTO_HOLD_QUOTE_RIGHT:-0}
      - RSA_ENCRYPT_ENABLE=${RSA_ENCRYPT_ENABLE:-false}

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: ${MEMORY_LIMIT:-2048M}
        reservations:
          cpus: '0.5'
          memory: ${MEMORY_RESERVATION:-256M}

    healthcheck:
      test: ["CMD", "pgrep", "-x", "FutuOpenD"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  opend-data:

networks:
  default:
    name: ${NETWORK_NAME:-futu-network}
    external: true
