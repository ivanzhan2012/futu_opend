[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:opend]
command=/app/FutuOpenD/FutuOpenD -no_monitor=1
directory=/app/FutuOpenD
autostart=false
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/opend.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/opend.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
user=ubuntu
environment=PYTHONPATH="/app/FutuOpenD" 